version: "3.8"

services:
  gristsync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gristsync
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=gristsync-redis
      - REDIS_PORT=6379
      - CONFIG_DIR=/app/configs
    volumes:
      - /var/www/gristsync/configs:/app/configs:ro
    depends_on:
      gristsync-redis:
        condition: service_healthy
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gristsync.rule=Host(`gristsync.teebase.net`)"
      - "traefik.http.routers.gristsync.entrypoints=websecure"
      - "traefik.http.routers.gristsync.tls.certresolver=letsencrypt"
      - "traefik.http.services.gristsync.loadbalancer.server.port=3000"
      - "traefik.http.routers.gristsync.middlewares=gristsync-headers@docker"
      - "traefik.http.middlewares.gristsync-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  gristsync-redis:
    image: redis:7.4-alpine
    container_name: gristsync-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "notice", "--maxmemory-policy", "noeviction"]
    volumes:
      - gristsync_redis_data:/data
    restart: unless-stopped
    networks:
      - traefik-proxy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  gristsync_redis_data:
    external: false

networks:
  traefik-proxy:
    external: true
